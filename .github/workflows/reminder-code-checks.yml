name: Reminder code checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [automatic-custom-reminders]

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q backend/app
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check app JavaScript syntax
        run: node --check docs/js/app.js
