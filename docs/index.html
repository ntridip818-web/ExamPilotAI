<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<title>ExamPilotAI — Never Miss an Opportunity</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="wordmark">
      <span class="wordmark-main">ExamPilot<span class="wordmark-ai">AI</span></span>
      <span class="wordmark-tag">Never Miss an Opportunity</span>
    </div>
    <button class="filter-btn" id="filterToggle" aria-label="Filter exams">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 4h16M5 10h10M8 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="filter-panel" id="filterPanel" hidden>
    <label>
      <span>State</span>
      <select id="stateFilter">
        <option value="">All States</option>
        <option value="West Bengal">West Bengal</option>
        <option value="Delhi">Delhi</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Uttar Pradesh">Uttar Pradesh</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
      </select>
    </label>
    <label>
      <span>Category</span>
      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="Clerical">Clerical</option>
        <option value="Engineering">Engineering</option>
        <option value="Teaching">Teaching</option>
        <option value="Banking">Banking</option>
        <option value="Police">Police</option>
      </select>
    </label>
  </div>
</header>

<nav class="tabstrip">
  <button class="tab is-active" data-tab="all">All Notices</button>
  <button class="tab" data-tab="closing">Closing Soon</button>
  <button class="tab" data-tab="saved">Saved</button>
</nav>

<main id="board" class="board">
  <div class="loading-state" id="loadingState">
    <div class="stamp-spinner"></div>
    <p>Fetching verified notices…</p>
  </div>
</main>

<template id="emptyStateTemplate">
  <div class="empty-state">
    <div class="empty-mark">✦</div>
    <h3></h3>
    <p></p>
  </div>
</template>

<template id="examCardTemplate">
  <article class="notice-card">
    <div class="notice-stamp" title="Verified official notification">
      <span>VERIFIED</span>
    </div>
    <p class="notice-org"></p>
    <h2 class="notice-title"></h2>
    <div class="notice-meta">
      <span class="notice-state"></span>
      <span class="notice-category"></span>
    </div>
    <div class="notice-deadline">
      <div class="deadline-stub">
        <span class="deadline-label">Apply by</span>
        <span class="deadline-date"></span>
      </div>
      <div class="countdown">
        <span class="countdown-num"></span>
        <span class="countdown-unit">days left</span>
      </div>
    </div>
    <div class="notice-actions">
      <a class="btn-pdf" target="_blank" rel="noopener">Official PDF ↗</a>
      <button class="btn-save">
        <svg class="icon-save" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 2.5C3 2 3.4 1.5 4 1.5h8c.6 0 1 .5 1 1v11.3c0 .5-.6.8-1 .5L8 11.2l-4 3.1c-.4.3-1 0-1-.5V2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <span class="save-label">Save</span>
      </button>
    </div>
  </article>
</template>

<nav class="bottom-nav">
  <button class="bnav-item is-active" data-tab="all">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 8.5 10 3l7 5.5V17a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1V8.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>Home</span>
  </button>
  <button class="bnav-item" data-tab="closing">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Deadlines</span>
  </button>
  <button class="bnav-item" data-tab="saved">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 3c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v14.2c0 .6-.7 1-1.2.6L10 14l-4.8 3.8c-.5.4-1.2 0-1.2-.6V3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>Saved</span>
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
